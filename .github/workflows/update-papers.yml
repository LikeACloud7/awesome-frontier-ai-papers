name: Update papers and deploy site

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      collection_outcome: ${{ steps.collect.outcome }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install verified collector dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Check collection and security regressions
        run: python -m unittest discover -s tests -v
      - name: Restore collector queues
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            output/affiliation_queue
            output/repository_scans
            output/publication_metadata
            output/openalex_institutions_cache.json
          key: collectors-v4-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: collectors-v4-${{ github.ref_name }}-
      - name: Collect publications with read-only repository access
        id: collect
        continue-on-error: true
        run: python scripts/update_company_papers.py --days 30 --comprehensive --reconcile --strict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      - name: Save collector queues after partial failures
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            output/affiliation_queue
            output/repository_scans
            output/publication_metadata
            output/openalex_institutions_cache.json
          key: collectors-v4-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate publication data
        run: python scripts/validate_publication_artifact.py public/data
      - name: Transfer data only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-data
          path: |
            public/data/company_papers.json
            public/data/collection_health.json
            public/data/collection_pending.json
            public/data/collection_state.json
          if-no-files-found: error
          retention-days: 3

  publish-index:
    needs: collect
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: publication-data
          path: ${{ runner.temp }}/publication-data
      - name: Validate and copy the data-only artifact
        run: python scripts/validate_publication_artifact.py "$RUNNER_TEMP/publication-data" --copy-to public/data
      - name: Generate Markdown using trusted repository code
        run: python scripts/generate_markdown_index.py
      - name: Commit and publish the validated index
        env:
          GH_PUBLICATION_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/data/company_papers.json public/data/collection_health.json public/data/collection_pending.json public/data/collection_state.json README.md docs/labs
          if git diff --cached --quiet; then
            echo "No publication changes to commit."
            exit 0
          fi
          git commit -m "chore: update company paper data"
          publication_auth=$(printf 'x-access-token:%s' "$GH_PUBLICATION_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$publication_auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $publication_auth" git push origin HEAD:main

  build:
    needs: collect
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: publication-data
          path: ${{ runner.temp }}/publication-data
      - name: Validate and copy publication data
        run: python scripts/validate_publication_artifact.py "$RUNNER_TEMP/publication-data" --copy-to public/data
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Build static site without publication permissions
        run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    needs: [build, publish-index]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  collection-status:
    needs: [collect, publish-index, build, deploy]
    if: always() && needs.collect.outputs.collection_outcome == 'failure'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: |
          echo "Collection reported errors. Successfully collected data was preserved; inspect the collector summary and collection_health.json."
          exit 1
